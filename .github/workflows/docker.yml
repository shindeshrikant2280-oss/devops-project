
name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      uses: actions/checkout@v4
      
      - name: test HTML
       run: |
          grep -q "My First DevOps Deployment" index.html
          grep -q "Docker Github CI/CD Cloud" index.html
          echo "HTML test passed"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
       
      - name: Build Docker image
        run: docker build -t shreexn/my-nginx:latest .
           
      - name: Push Docker image
        run: docker push shreexn/my-nginx:latest  
