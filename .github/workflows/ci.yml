 name: Flask CI Pipeline

 on:
   push:
      branches:
        - main
   pull_request:
     branches:
       -main

 jobs:
  test:
   runs-on: ubuntu-latest

   steps:
    - name: Checkout Repository
  uses: actions/checkout@v4

- name:Setup Python
  uses: action/setup-python@v5
  with:
    python-version:"3.12"

- name: Install Dependencies
  run: |
    pip install -r requirements.txt
    pip install pytest

- name: Run Automated Tests
  run:pytest -v
